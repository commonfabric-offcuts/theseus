# The release check, run on GitHub's runners for every pull request and every
# push to a release branch. It runs the same steps as tools/release_check.py on
# the Mac, split across runners: the native browser modes in shards, the units
# and the deploy refusals together, and the wake replay alone, since it is a
# timing measurement that a second run beside it would skew.
#
# The shard list is computed from tools/release_check.py itself (the plan job),
# so a mode added there is checked here without editing this file. Each shard
# runs `release_check.py --only`, so each summary speaks for its own steps, and
# the combine job folds them into the one whole-run summary the deploy reads
# (docs/tools.md), published as the release-check artifact.
#
# A red shard is a red check. Cases that fail on live today fail here too until
# they are fixed or recorded as expected; this workflow does not hide them.
#
# This workflow is the producer, and nothing more: it runs the candidate's own
# code, from the merge commit's copy of this file, and publishes the evidence.
# It cannot be trusted with the verdict, since a pull request can edit it. The
# verdict comes from the Verdict workflow on the default branch, which runs
# when this one completes, reads these artifacts as untrusted data, checks them
# against GitHub's record of this run, and runs the validator and the baseline
# from the pull request's base. The candidate's code runs here, so the token is
# read-only.
name: Checks

on:
  pull_request:
  push:
    branches:
      - 'release/**'
      - codex/aim-next
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push supersedes its older head, so its run is cancelled. Every push to a release branch
# is a merged train's head: its run is that head's judgment and the next train's control, so it runs to the end,
# grouped by its ref and commit together, since one commit can be pushed to two branches (each needs its own verdict).
concurrency:
  group: checks-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # The versions the Mac's harnesses run against (the release check's summaries name them).
  CHROME_VERSION: 156.0.8078.47
  PLAYWRIGHT_VERSION: 1.63.0
  # Three browser shards, the units and the replay make five jobs: one wave under the five-macOS-jobs-at-once cap
  # of a personal account. Raise this once the repository is under the organization, whose cap is fifty.
  BROWSER_SHARDS: 3

jobs:
  plan:
    name: plan the shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$BROWSER_SHARDS" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, ".")
          from tools import release_check as check
          shards_wanted = int(sys.argv[1])
          native = ["native-" + step.name for step in check.NATIVE_STEPS]
          # Deal the modes longest first into the least loaded shard, by the minutes each took on a runner
          # (.github/check-weights.json); a mode not measured yet takes the median, so a new mode is dealt, not dropped.
          measured = json.load(open(".github/check-weights.json"))["minutes"]
          known = sorted(measured.values())
          median = known[len(known) // 2] if known else 1.0
          loads = [[0.0, []] for _ in range(shards_wanted)]
          for name in sorted(native, key=lambda n: -measured.get(n, median)):
              lightest = min(loads, key=lambda b: b[0])
              lightest[0] += measured.get(name, median)
              lightest[1].append(name)
          shards = [{"name": "browser %d of %d (about %.0f min)" % (i + 1, shards_wanted, load), "steps": ",".join(names)}
                    for i, (load, names) in enumerate(loads)]
          shards.append({"name": "units and deploy refusals", "steps": ",".join(check.UNIT_STEPS + (check.DEPLOY_REFUSALS,))})
          shards.append({"name": "wake replay", "steps": check.WAKE_REPLAY})
          assert sorted(s for shard in shards for s in shard["steps"].split(",")) == sorted(check.REQUIRED), "every required step runs in exactly one shard"
          print("shards=" + json.dumps(shards))
          PY

  check:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: macos-26
    # A browser shard takes 24 to 33 minutes on a normal runner; 75 leaves room for a slow pool, which used all of
    # 45 on a18e8b1e. Units, deploy refusals and wake replay keep 45.
    timeout-minutes: ${{ startsWith(matrix.name, 'browser ') && 75 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The navigation step's shipped-editor case reads an older commit with git ls-tree, so the whole history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: The interpreters the check expects
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 --version
          node --version
      # Every job installs them: the check resolves Chrome and Playwright before it
      # reads --only, and refuses a run that cannot name them (tools/release_check.py).
      - name: Chrome for Testing and Playwright's WebKit
        shell: bash
        run: |
          set -euo pipefail
          browsers="$RUNNER_TEMP/browsers"
          mkdir -p "$browsers/playwright"
          # The same layout the Mac keeps under ~/Library/Caches/aim-chrome-for-testing (tools/release_check.py).
          npx --yes @puppeteer/browsers install "chrome@${CHROME_VERSION}" --path "$browsers"
          chrome="$browsers/chrome/mac_arm-${CHROME_VERSION}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          test -x "$chrome"
          (cd "$browsers/playwright" \
            && npm init -y >/dev/null \
            && npm install --no-audit --no-fund "playwright-core@${PLAYWRIGHT_VERSION}" "playwright@${PLAYWRIGHT_VERSION}" >/dev/null \
            && npx playwright install webkit)
          echo "AIM_CHROME_FOR_TESTING=$chrome" >> "$GITHUB_ENV"
          echo "AIM_PLAYWRIGHT_CORE=$browsers/playwright/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Release check, ${{ matrix.steps }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I tools/release_check.py --out "$RUNNER_TEMP/check" --node "$(command -v node)" --only "${{ matrix.steps }}"
      - name: Write this shard's receipt
        if: always()
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHARD_NAME: ${{ matrix.name }}
          SHARD_STEPS: ${{ matrix.steps }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/check"
          # The receipt a validator binds this shard to: written here, by the job that ran it, so a shard repackaged from
          # another run or attempt cannot pass as this one. The profile says what the cases ran on.
          /usr/bin/python3 -I - "$RUNNER_TEMP/check/run.json" <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          env = os.environ
          def out(*argv):
              try:
                  return subprocess.run(argv, capture_output=True, text=True).stdout.strip()
              except OSError:
                  return None
          def digest(path):
              try:
                  return hashlib.sha256(open(path, "rb").read()).hexdigest()
              except OSError:
                  return None
          receipt = {
              "run": {"id": env.get("GITHUB_RUN_ID"), "attempt": env.get("GITHUB_RUN_ATTEMPT"), "workflow": env.get("GITHUB_WORKFLOW"),
                      "job": env.get("GITHUB_JOB"), "event": env.get("GITHUB_EVENT_NAME"), "repository": env.get("GITHUB_REPOSITORY"),
                      # The commit this workflow file was read from: the proof of whose workflow judged the run.
                      "workflow_sha": env.get("GITHUB_WORKFLOW_SHA"), "workflow_ref": env.get("GITHUB_WORKFLOW_REF")},
              "shard": {"name": env.get("SHARD_NAME"), "steps": (env.get("SHARD_STEPS") or "").split(",")},
              "base": {"ref": env.get("BASE_REF") or None, "sha": env.get("BASE_SHA") or None},
              "head": {"ref": env.get("HEAD_REF") or env.get("GITHUB_REF"), "sha": env.get("HEAD_SHA") or env.get("GITHUB_SHA")},
              # The commit the check ran, read from the checkout. On a pull request it is the merge commit: its first
              # parent is the base GitHub merged onto, which can be newer than the event's base, and its second is the
              # pull request's head; on a push it has one parent and the second reads as none.
              "merge": {"sha": out("git", "rev-parse", "HEAD"), "tree": out("git", "rev-parse", "HEAD^{tree}"),
                        "first_parent": out("git", "rev-parse", "--verify", "-q", "HEAD^1") or None,
                        "second_parent": out("git", "rev-parse", "--verify", "-q", "HEAD^2") or None},
              # The summary this receipt vouches for, so a summary swapped in beside a genuine receipt does not count.
              "summary_sha256": digest(os.path.join(os.path.dirname(sys.argv[1]), "summary.json")),
              "profile": {"runner_os": env.get("RUNNER_OS"), "runner_arch": env.get("RUNNER_ARCH"), "image_os": env.get("ImageOS"),
                          "image_version": env.get("ImageVersion"), "platform": platform.platform(), "python": sys.version.split()[0],
                          "node": out("node", "--version"), "chrome": env.get("CHROME_VERSION"), "playwright": env.get("PLAYWRIGHT_VERSION"),
                          "chrome_path": env.get("AIM_CHROME_FOR_TESTING"), "playwright_core": env.get("AIM_PLAYWRIGHT_CORE"),
                          # The settings the cases turned out to depend on: how scroll bars show, whether motion is reduced,
                          # and how loaded the machine was, which a Mac at a desk never varies.
                          "scroll_bars": out("defaults", "read", "-g", "AppleShowScrollBars") or "default",
                          "reduce_motion": out("defaults", "read", "com.apple.universalaccess", "reduceMotion") or "default",
                          "cpus": out("sysctl", "-n", "hw.ncpu"),
                          "load_after": out("sysctl", "-n", "vm.loadavg")},
          }
          json.dump(receipt, open(sys.argv[1], "w"), indent=1)
          PY
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore

  combine:
    name: the whole run's summary
    needs: [plan, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: check-*
          path: shards
      - name: Fold the shards' summaries into one
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLAN_SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          mkdir -p release-check
          python3 - shards release-check/summary.json <<'PY'
          import glob, hashlib, json, os, sys
          shards_dir, out = sys.argv[1], sys.argv[2]
          paths = sorted(glob.glob(os.path.join(shards_dir, "check-*", "summary.json")))
          docs = [json.load(open(p)) for p in paths]
          # Every shard must carry the receipt its own job wrote, for this run and this attempt, naming this summary;
          # a shard from another run or attempt, however identical its commit and cases, does not count.
          env = os.environ
          receipts = []
          for p in paths:
              receipt_path = os.path.join(os.path.dirname(p), "run.json")
              try:
                  receipt = json.load(open(receipt_path))
              except (OSError, ValueError) as error:
                  sys.exit("no readable receipt beside %s: %s" % (p, error))
              run = receipt.get("run") or {}
              if (run.get("id"), run.get("attempt")) != (env.get("GITHUB_RUN_ID"), env.get("GITHUB_RUN_ATTEMPT")):
                  sys.exit("%s was produced by run %s attempt %s, not this run %s attempt %s" % (
                      receipt_path, run.get("id"), run.get("attempt"), env.get("GITHUB_RUN_ID"), env.get("GITHUB_RUN_ATTEMPT")))
              if receipt.get("summary_sha256") != hashlib.sha256(open(p, "rb").read()).hexdigest():
                  sys.exit("%s is not the summary %s vouches for" % (p, receipt_path))
              receipts.append(receipt)
          # The merge commit, its tree and its parents come from the receipts, each written by a shard with the whole
          # history; this job's own checkout is shallow and sees no parents. The shards must agree, and name this run's commit.
          merges = {json.dumps(r.get("merge"), sort_keys=True) for r in receipts}
          if len(merges) != 1:
              sys.exit("the shards name different merges: %s" % sorted(merges))
          merge = receipts[0].get("merge") or {}
          if merge.get("sha") != env.get("GITHUB_SHA"):
              sys.exit("the shards checked %s, not this run's commit %s" % (merge.get("sha"), env.get("GITHUB_SHA")))
          # A job refused before running wrote a summary with no steps and no times; it still counts, as missing steps.
          timed = [d for d in docs if d.get("started_at") and d.get("finished_at")]
          if not docs or not timed:
              sys.exit("no shard wrote a summary with a run in it")
          commits = {d.get("commit") for d in docs}
          if len(commits) != 1:
              sys.exit("the shards checked different commits: %s" % sorted(commits))
          steps = [step for d in docs for step in d.get("steps", [])]
          names = [step["name"] for step in steps]
          if len(names) != len(set(names)):
              sys.exit("a step ran in two shards: %s" % sorted(n for n in set(names) if names.count(n) > 1))
          required = sorted(set().union(*[set(d.get("required") or []) for d in docs]))
          missing = [name for name in required if name not in names]
          first = timed[0]
          # The shape tools/release_check.py writes, so tools/release_check.judge_summary reads it as one run of this
          # commit: no `only`, every required step present, the tree unchanged in every shard.
          combined = {key: first[key] for key in ("tool", "commit", "checkout", "chrome", "playwright", "tools", "required") if key in first}
          combined.update({
              "started_at": min(d["started_at"] for d in timed),
              "finished_at": max(d["finished_at"] for d in timed),
              "steps": steps,
              "tree_unchanged": all(d.get("tree_unchanged") is True for d in timed),
              "tree_after": first.get("tree_after"),
              "skipped": None,
              "passed": all(step["passed"] for step in steps) and not missing,
              "failed": sorted(step["name"] for step in steps if not step["passed"]) + missing,
              "combined_from": [os.path.relpath(p, shards_dir) for p in paths],
          })
          json.dump(combined, open(out, "w"), indent=1)
          # Beside the summary, what a validator binds to: this run and attempt, the event's base and head, the merge
          # commit and its tree, each shard's own source identity and steps, and the plan the shards were dealt from.
          profiles = [r.get("profile") for r in receipts]
          provenance = {
              "profiles": profiles if len({json.dumps(x, sort_keys=True) for x in profiles}) > 1 else profiles[:1],
              "run": {"id": env.get("GITHUB_RUN_ID"), "attempt": env.get("GITHUB_RUN_ATTEMPT"), "workflow": env.get("GITHUB_WORKFLOW"),
                      "event": env.get("GITHUB_EVENT_NAME"), "repository": env.get("GITHUB_REPOSITORY"),
                      "workflow_sha": env.get("GITHUB_WORKFLOW_SHA"), "workflow_ref": env.get("GITHUB_WORKFLOW_REF")},
              "base": {"ref": env.get("BASE_REF") or None, "sha": env.get("BASE_SHA") or None},
              "head": {"ref": env.get("HEAD_REF") or env.get("GITHUB_REF"), "sha": env.get("HEAD_SHA") or env.get("GITHUB_SHA")},
              "merge": {key: merge.get(key) for key in ("sha", "tree", "first_parent", "second_parent")},
              "checked": {"commit": combined["commit"], "tree_unchanged": combined["tree_unchanged"]},
              "required": required,
              "plan": json.loads(env.get("PLAN_SHARDS") or "[]"),
              "shards": [{"artifact": os.path.relpath(p, shards_dir).split(os.sep)[0], "commit": d.get("commit"), "tree_unchanged": d.get("tree_unchanged"),
                          "tools": d.get("tools"), "steps": [step["name"] for step in d.get("steps", [])], "refused": d.get("refused"),
                          "receipt": r}
                         for p, d, r in zip(paths, docs, receipts)],
          }
          json.dump(provenance, open(os.path.join(os.path.dirname(out), "provenance.json"), "w"), indent=1)
          print(json.dumps({"commit": combined["commit"], "steps": len(steps), "missing": missing, "failed": combined["failed"], "passed": combined["passed"]}))
          sys.exit(0 if combined["passed"] else 1)
          PY
      - name: Keep the whole run's summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: release-check
          if-no-files-found: ignore
