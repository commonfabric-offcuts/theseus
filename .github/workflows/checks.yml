# One expressly authorised train45 correction run (warp8513).
# Manual only; no PR/push trigger. All other production checks remain unchanged.
name: Checks
on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact original train45 source commit
        required: true
        type: string
permissions:
  contents: read
env:
  CHROME_VERSION: 156.0.8078.47
  PLAYWRIGHT_VERSION: 1.63.0
jobs:
  check:
    name: train45 correction ${{ matrix.steps }}
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unfinished-browser-0
            steps: native-webkit-colors,native-duties,native-reader-mutations,native-webkit-device
          - name: unfinished-browser-2
            steps: native-card-marks,native-webkit-pipeline,native-reader-finished,native-connected,native-webkit-invite,native-sources,native-journal,native-reader-keyboard
    steps:
      - uses: actions/checkout@v4
        with:
          # The navigation step's shipped-editor case reads an older commit with git ls-tree, so the whole history.
          fetch-depth: 0
          ref: ${{ inputs.source_head }}
      - name: Bind the requested source independently of the workflow head
        shell: bash
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: |
          /usr/bin/python3 -I - <<'PYBOUND'
          import hashlib, json, os, pathlib, re, subprocess
          source = os.environ['SOURCE_HEAD']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'exact source SHA required'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == source, 'checkout differs from requested source'
          assert not git('status', '--porcelain'), 'dirty source checkout'
          original = 'f31e319994ecc96c5565828a53fde75c01bd3386'
          base = 'a958f7cdebe3743b9a6ebf63c11564629d737bce'
          subprocess.run(['git', 'merge-base', '--is-ancestor', original, source], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, source], check=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP'])
          record = {'version': 1, 'requested_source': source, 'checked_source': git('rev-parse', 'HEAD'),
                    'checked_tree': git('rev-parse', 'HEAD^{tree}'), 'parents': git('show', '-s', '--format=%P', 'HEAD').split(),
                    'original_source': original, 'original_run': 44219718033, 'original_attempt': 1,
                    'release_base': base, 'workflow_api_head': os.environ['GITHUB_SHA'],
                    'workflow_sha': os.environ.get('GITHUB_WORKFLOW_SHA'), 'workflow_ref': os.environ.get('GITHUB_WORKFLOW_REF'),
                    'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'event': os.environ['GITHUB_EVENT_NAME'], 'source_changes': ''}
          (out / 'dispatch-source.json').write_text(json.dumps(record, indent=2) + '\n')
          PYBOUND
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: The interpreters the check expects
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 --version
          node --version
      # Every job installs them: the check resolves Chrome and Playwright before it
      # reads --only, and refuses a run that cannot name them (tools/release_check.py).
      - name: Chrome for Testing and Playwright's WebKit
        shell: bash
        run: |
          set -euo pipefail
          browsers="$RUNNER_TEMP/browsers"
          mkdir -p "$browsers/playwright"
          # The same layout the Mac keeps under ~/Library/Caches/aim-chrome-for-testing (tools/release_check.py).
          npx --yes @puppeteer/browsers install "chrome@${CHROME_VERSION}" --path "$browsers"
          chrome="$browsers/chrome/mac_arm-${CHROME_VERSION}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          test -x "$chrome"
          (cd "$browsers/playwright" \
            && npm init -y >/dev/null \
            && npm install --no-audit --no-fund "playwright-core@${PLAYWRIGHT_VERSION}" "playwright@${PLAYWRIGHT_VERSION}" >/dev/null \
            && npx playwright install webkit)
          echo "AIM_CHROME_FOR_TESTING=$chrome" >> "$GITHUB_ENV"
          echo "AIM_PLAYWRIGHT_CORE=$browsers/playwright/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Release check, ${{ matrix.steps }}
        shell: bash
        run: |
          set -euo pipefail
          # The quarantine is read at the event's base: a pull request's base, or the commit a push moved the branch from.
          /usr/bin/python3 -I tools/release_check.py --out "$RUNNER_TEMP/check" --node "$(command -v node)" --only "${{ matrix.steps }}" \
            --quarantine-at event
      - name: Write this shard's receipt
        if: always()
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHARD_NAME: ${{ matrix.name }}
          SHARD_STEPS: ${{ matrix.steps }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/check"
          # The check must begin with a fresh output directory. Preserve the pre-run binding only after it ends.
          cp "$RUNNER_TEMP/dispatch-source.json" "$RUNNER_TEMP/check/dispatch-source.json"
          # The receipt a validator binds this shard to: written here, by the job that ran it, so a shard repackaged from
          # another run or attempt cannot pass as this one. The profile says what the cases ran on.
          /usr/bin/python3 -I - "$RUNNER_TEMP/check/run.json" <<'PY'
          import hashlib, json, os, platform, re, subprocess, sys
          env = os.environ
          def out(*argv):
              try:
                  return subprocess.run(argv, capture_output=True, text=True).stdout.strip()
              except OSError:
                  return None
          def digest(path):
              try:
                  return hashlib.sha256(open(path, "rb").read()).hexdigest()
              except OSError:
                  return None
          receipt = {
              "run": {"id": env.get("GITHUB_RUN_ID"), "attempt": env.get("GITHUB_RUN_ATTEMPT"), "workflow": env.get("GITHUB_WORKFLOW"),
                      "job": env.get("GITHUB_JOB"), "event": env.get("GITHUB_EVENT_NAME"), "repository": env.get("GITHUB_REPOSITORY"),
                      # The commit this workflow file was read from: the proof of whose workflow judged the run.
                      "workflow_sha": env.get("GITHUB_WORKFLOW_SHA"), "workflow_ref": env.get("GITHUB_WORKFLOW_REF")},
              "shard": {"name": env.get("SHARD_NAME"), "steps": (env.get("SHARD_STEPS") or "").split(",")},
              "base": {"ref": env.get("BASE_REF") or None, "sha": env.get("BASE_SHA") or None},
              "head": {"ref": env.get("HEAD_REF") or env.get("GITHUB_REF"), "sha": env.get("HEAD_SHA") or env.get("GITHUB_SHA")},
              # The commit the check ran, read from the checkout. On a pull request it is the merge commit: its first
              # parent is the base GitHub merged onto, which can be newer than the event's base, and its second is the
              # pull request's head; on a push it has one parent and the second reads as none.
              "merge": {"sha": out("git", "rev-parse", "HEAD"), "tree": out("git", "rev-parse", "HEAD^{tree}"),
                        "first_parent": out("git", "rev-parse", "--verify", "-q", "HEAD^1") or None,
                        "second_parent": out("git", "rev-parse", "--verify", "-q", "HEAD^2") or None},
              # The summary this receipt vouches for, so a summary swapped in beside a genuine receipt does not count.
              "summary_sha256": digest(os.path.join(os.path.dirname(sys.argv[1]), "summary.json")),
              "profile": {"runner_os": env.get("RUNNER_OS"), "runner_arch": env.get("RUNNER_ARCH"), "image_os": env.get("ImageOS"),
                          "image_version": env.get("ImageVersion"), "platform": platform.platform(), "python": sys.version.split()[0],
                          "node": out("node", "--version"), "chrome": env.get("CHROME_VERSION"), "playwright": env.get("PLAYWRIGHT_VERSION"),
                          "chrome_path": env.get("AIM_CHROME_FOR_TESTING"), "playwright_core": env.get("AIM_PLAYWRIGHT_CORE"),
                          # The settings the cases turned out to depend on: how scroll bars show, whether motion is reduced,
                          # and how loaded the machine was, which a Mac at a desk never varies.
                          "scroll_bars": out("defaults", "read", "-g", "AppleShowScrollBars") or "default",
                          "reduce_motion": out("defaults", "read", "com.apple.universalaccess", "reduceMotion") or "default",
                          "cpus": out("sysctl", "-n", "hw.ncpu"),
                          "load_after": out("sysctl", "-n", "vm.loadavg")},
          }
          # Preserve the event's base above. This is the base Git actually used to build the tested merge.
          if env.get("GITHUB_EVENT_NAME") == "pull_request" and not re.fullmatch(r"[0-9a-f]{40}", receipt["merge"]["first_parent"] or ""):
              sys.exit("the PR checkout has no Git first-parent commit id")
          receipt["base_at_run"] = ({"ref": env.get("BASE_REF"), "sha": receipt["merge"]["first_parent"]}
                                    if env.get("GITHUB_EVENT_NAME") == "pull_request" else None)
          json.dump(receipt, open(sys.argv[1], "w"), indent=1)
          PY
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore
