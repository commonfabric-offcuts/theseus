# Authorized one-call scoped717 correction; not release acceptance or a whole suite.
name: Checks
on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact corrected717source
        required: true
        type: string
permissions:
  contents: read
jobs:
  scoped717:
    name: 717 joint final affected units
    runs-on: macos-26
    timeout-minutes: 49
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_head }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Bound four-module final correction check
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-joint.py" <<'PYSCOPED'
          import datetime,hashlib,json,os,pathlib,platform,re,subprocess,sys,time,unittest
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'scoped-717';out.mkdir();source='f0b4cc749884fd716643be9c360c4c83cba16d6b';tree='320bd32b833cc28dace4e08b6c2069542b9067c9'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert sys.version_info[:2]==(3,9),sys.version
          assert os.environ['SOURCE_HEAD']==source and git('rev-parse','HEAD')==source and git('rev-parse','HEAD^{tree}')==tree
          assert not git('status','--porcelain')
          assert sys.pycache_prefix and str(pathlib.Path(os.environ['RUNNER_TEMP'])) in sys.pycache_prefix
          nodes=['tests/ui_reader_changes.test.mjs','tests/ui_item_655_evidence.test.mjs','tests/ui_dossier_cover.test.mjs'];modules=['test_tools_ci_known_reds'];paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0');hashes={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths if p and (root/p).is_file()}
          record={'source':source,'tree':tree,'parents':git('show','-s','--format=%P','HEAD').split(),'workflow_sha':os.environ.get('GITHUB_WORKFLOW_SHA'),'workflow_event_sha':os.environ.get('GITHUB_SHA'),'workflow_ref':os.environ.get('GITHUB_WORKFLOW_REF'),'run':os.environ.get('GITHUB_RUN_ID'),'attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'event':os.environ.get('GITHUB_EVENT_NAME'),'python':sys.version,'node':subprocess.check_output(['node','--version'],text=True).strip(),'platform':platform.platform(),'image':os.environ.get('ImageVersion'),'cache_prefix':sys.pycache_prefix,'source_sha256':hashes,'node_modules':nodes,'python_modules':modules,'authority':[9321,9326],'prior_actual':19,'allocation':'one joint scoped unit job, third FINAL call, cumulative20 LASTFORDAY','scope':'four complete affected modules; NOT whole Python/Node suites'}
          (out/'source.json').write_text(json.dumps(record,indent=2))
          results=[]
          for i,path in enumerate(nodes):
           log=out/f'node-{i+1}.log';cmd=['node','--test','--test-reporter=tap',path];start=time.monotonic()
           with log.open('w') as stream:r=subprocess.run(cmd,stdout=stream,stderr=subprocess.STDOUT)
           text=log.read_text();counts={k:int(re.findall(r'^# '+k+r' (\d+)$',text,re.M)[-1]) for k in ['tests','pass','fail','cancelled','skipped','todo'] if re.findall(r'^# '+k+r' (\d+)$',text,re.M)}
           results.append({'module':path,'argv':cmd,'exit':r.returncode,'counts':counts,'wall_seconds':time.monotonic()-start,'log':log.name,'sha256':hashlib.sha256(log.read_bytes()).hexdigest()})
          sys.path.insert(0,str(root));sys.path.insert(0,str(root/'tests'))
          def leaves(suite):
           for test in suite:
            if isinstance(test,unittest.TestSuite):yield from leaves(test)
            else:yield test
          loader=unittest.TestLoader();start=time.monotonic();suite=loader.loadTestsFromNames(modules);discovery=time.monotonic()-start;ids=[t.id() for t in leaves(suite)]
          (out/'python-inventory.json').write_text(json.dumps({'modules':modules,'ids':ids,'count':len(ids),'loader_errors':loader.errors,'discovery_seconds':discovery},indent=2));assert not loader.errors and ids and len(ids)==len(set(ids))
          start=time.monotonic()
          with (out/'python.log').open('w') as stream:r=unittest.TextTestRunner(stream=stream,verbosity=2).run(suite)
          py={'modules':modules,'tests_run':r.testsRun,'failures':[{'id':t.id(),'traceback':e} for t,e in r.failures],'errors':[{'id':t.id(),'traceback':e} for t,e in r.errors],'skipped':[{'id':t.id(),'why':why} for t,why in r.skipped],'expected_failures':[{'id':t.id(),'traceback':e} for t,e in r.expectedFailures],'unexpected_successes':[t.id() for t in r.unexpectedSuccesses],'successful':r.wasSuccessful(),'wall_seconds':time.monotonic()-start,'log':'python.log','sha256':hashlib.sha256((out/'python.log').read_bytes()).hexdigest()};assert r.testsRun==len(ids)
          summary={'source':source,'tree':tree,'node':results,'python':py,'source_dirty_after':git('status','--porcelain'),'finished_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (out/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps({'node':[{'module':x['module'],'exit':x['exit'],'counts':x['counts']} for x in results],'python_tests':r.testsRun,'python_failures':len(r.failures),'python_errors':len(r.errors),'source_dirty_after':summary['source_dirty_after']}));sys.exit(0 if r.wasSuccessful() and all(x['exit']==0 for x in results) and not summary['source_dirty_after'] else 1)
          PYSCOPED
          /usr/bin/python3 -I -X pycache_prefix="$RUNNER_TEMP/pyc-717-correction" "$RUNNER_TEMP/run-joint.py"
      - name: Keep original scoped evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped717
          path: ${{ runner.temp }}/scoped-717
          if-no-files-found: error
