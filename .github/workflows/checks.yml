# Authorized one-call scoped756 correction; not release acceptance or a whole suite.
name: Checks
on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact corrected756source
        required: true
        type: string
permissions:
  contents: read
jobs:
  scoped756:
    name: 756 scoped Python correction
    runs-on: macos-26
    timeout-minutes: 49
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_head }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Bound three-module correction check
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-scoped.py" <<'PYSCOPED'
          import datetime, hashlib, json, os, pathlib, platform, subprocess, sys, time, unittest
          root=pathlib.Path.cwd(); out=pathlib.Path(os.environ['RUNNER_TEMP'])/'scoped-756'; out.mkdir()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          source='06d3eec932a41365d34ff1b661478ef611cb4bc2'
          assert os.environ['SOURCE_HEAD']==source and git('rev-parse','HEAD')==source
          assert git('rev-parse','HEAD^{tree}')=='cde2e930d7a648f8f1d6104bee5307f64f30939f'
          assert not git('status','--porcelain'), 'dirty source before test'
          modules=['test_tools_ci_known_reds','test_whispers','test_workspaces']
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          source_map={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths if p and (root/p).is_file()}
          record={'source':source,'tree':git('rev-parse','HEAD^{tree}'),'parents':git('show','-s','--format=%P','HEAD').split(),'workflow_sha':os.environ.get('GITHUB_WORKFLOW_SHA'),'workflow_event_sha':os.environ.get('GITHUB_SHA'),'workflow_ref':os.environ.get('GITHUB_WORKFLOW_REF'),'run':os.environ.get('GITHUB_RUN_ID'),'attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'event':os.environ.get('GITHUB_EVENT_NAME'),'modules':modules,'authority':[9258,9259],'python':sys.version,'platform':platform.platform(),'image':os.environ.get('ImageVersion'),'cache_prefix':sys.pycache_prefix,'source_sha256':source_map,'scope':'three complete failure-owning modules; NOT a whole Python suite or original partition pass'}
          assert sys.pycache_prefix and str(pathlib.Path(os.environ['RUNNER_TEMP'])) in sys.pycache_prefix
          (out/'source.json').write_text(json.dumps(record,indent=2))
          sys.path.insert(0,str(root));sys.path.insert(0,str(root/'tests'))
          def leaves(suite):
           for test in suite:
            if isinstance(test,unittest.TestSuite): yield from leaves(test)
            else: yield test
          started=time.monotonic();loader=unittest.TestLoader();suite=loader.loadTestsFromNames(modules);discovery=time.monotonic()-started
          ids=[t.id() for t in leaves(suite)];inventory={'modules':modules,'case_ids':ids,'count':len(ids),'discovery_seconds':discovery,'loader_errors':loader.errors,'original_expected_count':172}
          (out/'inventory.json').write_text(json.dumps(inventory,indent=2));assert not loader.errors,loader.errors;assert len(ids)==172 and len(set(ids))==172,(len(ids),len(set(ids)))
          started=time.monotonic()
          with (out/'python-scoped.log').open('w') as log: result=unittest.TextTestRunner(stream=log,verbosity=2).run(suite)
          summary={'source':source,'modules':modules,'tests_run':result.testsRun,'failures':[{'id':t.id(),'traceback':error} for t,error in result.failures],'errors':[{'id':t.id(),'traceback':error} for t,error in result.errors],'skips':[{'id':t.id(),'why':why} for t,why in result.skipped],'expected_failures':[{'id':t.id(),'traceback':error} for t,error in result.expectedFailures],'unexpected_successes':[t.id() for t in result.unexpectedSuccesses],'successful':result.wasSuccessful(),'wall_seconds':time.monotonic()-started,'discovery_seconds':discovery,'finished_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source_dirty_after':git('status','--porcelain'),'log_sha256':hashlib.sha256((out/'python-scoped.log').read_bytes()).hexdigest(),'inventory_sha256':hashlib.sha256((out/'inventory.json').read_bytes()).hexdigest()}
          (out/'summary.json').write_text(json.dumps(summary,indent=2));assert result.testsRun==len(ids),(result.testsRun,len(ids))
          print(json.dumps({k:summary[k] for k in ['source','tests_run','successful','wall_seconds','discovery_seconds','source_dirty_after']}));print(json.dumps({'failures':[v['id'] for v in summary['failures']],'errors':[v['id'] for v in summary['errors']]}));sys.exit(0 if result.wasSuccessful() and not summary['source_dirty_after'] else 1)
          PYSCOPED
          /usr/bin/python3 -I -X pycache_prefix="$RUNNER_TEMP/pyc-756-correction" "$RUNNER_TEMP/run-scoped.py"
      - name: Keep original scoped evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped756
          path: ${{ runner.temp }}/scoped-756
          if-no-files-found: error
