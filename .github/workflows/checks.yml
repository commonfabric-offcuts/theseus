    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: wrapper
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_head }}
          path: product
          fetch-depth: 0
      - name: Bind immutable source and approved packet
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
          GROUP_FILE: ${{ matrix.group_file }}
        run: |
          /usr/bin/python3 -I wrapper/continuation775/bind-job.py before
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Chrome for Testing and Playwright WebKit
        shell: bash
        run: |
          set -euo pipefail
          browsers="$RUNNER_TEMP/browsers"
          mkdir -p "$browsers/playwright"
          npx --yes @puppeteer/browsers install "chrome@${CHROME_VERSION}" --path "$browsers"
          chrome="$browsers/chrome/mac_arm-${CHROME_VERSION}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          test -x "$chrome"
          (cd "$browsers/playwright" && npm init -y >/dev/null && npm install --no-audit --no-fund "playwright-core@${PLAYWRIGHT_VERSION}" "playwright@${PLAYWRIGHT_VERSION}" >/dev/null && npx playwright install webkit)
          echo "AIM_CHROME_FOR_TESTING=$chrome" >> "$GITHUB_ENV"
          echo "AIM_PLAYWRIGHT_CORE=$browsers/playwright/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: One exact bounded group with its own disposable checkout
        shell: bash
        env:
          GROUP_FILE: ${{ matrix.group_file }}
        run: |
          set -euo pipefail
          wrapper="$GITHUB_WORKSPACE/wrapper/continuation775"
          export PYTHONPATH="$wrapper"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/producer-pyc"
          /usr/bin/python3 "$wrapper/tools/run_compose_group.py" --root "$GITHUB_WORKSPACE/product" --group "$wrapper/$GROUP_FILE" --evidence "$RUNNER_TEMP/check" --chrome "$AIM_CHROME_FOR_TESTING" --playwright "$AIM_PLAYWRIGHT_CORE" --node "$(command -v node)"
      - name: Record genuine job identity and all result hashes
        if: always()
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
          GROUP_FILE: ${{ matrix.group_file }}
        run: |
          /usr/bin/python3 -I wrapper/continuation775/bind-job.py after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/check
          if-no-files-found: error
