# Bounded PR86 correction checks under warp8958/8969/8979/8983.
# Manual only; no PR/push trigger. All other production checks remain unchanged.
name: Checks
on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact corrected PR86 source commit
        required: true
        type: string
permissions:
  contents: read
env:
  CHROME_VERSION: 156.0.8078.47
  PLAYWRIGHT_VERSION: 1.63.0
jobs:
  check:
    name: PR86 correction ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 49
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python2-whole
            steps: python-units
            python_shard: "2/4"
          - name: python3-whole
            steps: python-units
            python_shard: "3/4"
          - name: deploy-refusals-whole
            steps: deploy-refusals
            python_shard: ""
          - name: python4-subset
            steps: python-units
            python_shard: "subset"
          - name: compose-corrected
            steps: native-compose
            python_shard: ""
    steps:
      - uses: actions/checkout@v4
        with:
          # The navigation step's shipped-editor case reads an older commit with git ls-tree, so the whole history.
          fetch-depth: 0
          ref: ${{ inputs.source_head }}
      - name: Bind the requested source independently of the workflow head
        shell: bash
        env:
          SOURCE_HEAD: ${{ inputs.source_head }}
        run: |
          /usr/bin/python3 -I - <<'PYBOUND'
          import hashlib, json, os, pathlib, re, subprocess
          source = os.environ['SOURCE_HEAD']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'exact source SHA required'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == source, 'checkout differs from requested source'
          assert not git('status', '--porcelain'), 'dirty source checkout'
          original = '6e08d31e1c52caa670b09185ec01ffe052942397'
          base = '3187c1bc851bdb256c272928a00dce974e2c8e48'
          assert source == 'd0978e76ba115ece3f03754a220aee2d6ceba87b', 'correction source differs'
          assert git('rev-parse', 'HEAD^{tree}') == '490fa783d2131680ab9754ac27b95f2a92e29c35', 'correction tree differs'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, source], check=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP'])
          record = {'version': 1, 'requested_source': source, 'checked_source': git('rev-parse', 'HEAD'),
                    'checked_tree': git('rev-parse', 'HEAD^{tree}'), 'parents': git('show', '-s', '--format=%P', 'HEAD').split(),
                    'original_source': original, 'original_run': 44284000276, 'original_attempt': 1,
                    'release_base': base, 'workflow_api_head': os.environ['GITHUB_SHA'],
                    'workflow_sha': os.environ.get('GITHUB_WORKFLOW_SHA'), 'workflow_ref': os.environ.get('GITHUB_WORKFLOW_REF'),
                    'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'event': os.environ['GITHUB_EVENT_NAME'], 'source_changes': git('diff','--name-only',original,source), 'authority': [8958,8969,8979,8983]}
          (out / 'dispatch-source.json').write_text(json.dumps(record, indent=2) + '\n')
          PYBOUND
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: The interpreters the check expects
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 --version
          node --version
      # Every job installs them: the check resolves Chrome and Playwright before it
      # reads --only, and refuses a run that cannot name them (tools/release_check.py).
      - name: Chrome for Testing and Playwright's WebKit
        shell: bash
        run: |
          set -euo pipefail
          browsers="$RUNNER_TEMP/browsers"
          mkdir -p "$browsers/playwright"
          # The same layout the Mac keeps under ~/Library/Caches/aim-chrome-for-testing (tools/release_check.py).
          npx --yes @puppeteer/browsers install "chrome@${CHROME_VERSION}" --path "$browsers"
          chrome="$browsers/chrome/mac_arm-${CHROME_VERSION}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          test -x "$chrome"
          (cd "$browsers/playwright" \
            && npm init -y >/dev/null \
            && npm install --no-audit --no-fund "playwright-core@${PLAYWRIGHT_VERSION}" "playwright@${PLAYWRIGHT_VERSION}" >/dev/null \
            && npx playwright install webkit)
          echo "AIM_CHROME_FOR_TESTING=$chrome" >> "$GITHUB_ENV"
          echo "AIM_PLAYWRIGHT_CORE=$browsers/playwright/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: Explicit Python4 case subset
        if: matrix.python_shard == 'subset'
        shell: bash
        env:
          PR86_CASES_1: ""
          PR86_CASES_2: ""
          PR86_CASES_3: ""
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/check"
          /usr/bin/python3 -I -B - "$RUNNER_TEMP/check" <<'PYSUBSET' 2>&1 | tee "$RUNNER_TEMP/check/python-units.log"
          from pathlib import Path
          import base64, collections, gzip, hashlib, json, os, subprocess, sys, time, unittest
          root=Path.cwd()
          out=Path(sys.argv[1]);out.mkdir(exist_ok=True)
          sys.path.insert(0,str(root))
          from tools import unit_shards as u
          expected_source='d0978e76ba115ece3f03754a220aee2d6ceba87b'
          encoded=''.join(os.environ.pop('PR86_CASES_'+str(i)) for i in range(1,4))
          selection_bytes=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(selection_bytes).hexdigest()=='9aa9d020a7fa4fcc7cb6fe14992c7c34ea97696e94ae39770fbab4b06e53d637'
          selection=json.loads(selection_bytes)
          requested=selection['requested']
          original_inventory=selection['original_inventory']
          original_log_sha=selection['original_log_sha']
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==expected_source
          before=git('status','--porcelain');assert not before
          loader=u.FileLoader(root)
          suite=loader.discover(str(root/'tests'),pattern='test_*.py')
          weights=json.loads((root/'.github/check-weights.json').read_text())
          selected_files=next(r['files'] for r in u.jobs(root,weights) if r.get('python_shard')=='4/4')
          available=[t for t in u.leaves(suite) if loader.owners[id(t)] in selected_files]
          by_id={t.id():t for t in available}
          assert len(by_id)==len(available), 'duplicate collected identities'
          assert set(by_id)==set(original_inventory), 'source collection differs; reconcile instead of dropping cases'
          assert len(requested)==len(set(requested))==135 and set(requested)<=set(by_id)
          selected=[by_id[name] for name in requested]
          inv={'kind':'explicit-python4-case-subset','authority':[8958,8969,8979,8983],
           'source':expected_source,'tree':git('rev-parse','HEAD^{tree}'),'original_source':'6e08d31e1c52caa670b09185ec01ffe052942397',
           'original_run':44284000276,'original_attempt':1,'original_log_sha256':original_log_sha,
           'original_inventory':original_inventory,'selected_ids':requested,'selected_files':selected_files,
           'counts':{'source_inventory':len(by_id),'selected':len(selected),'not_run_here':len(by_id)-len(selected)},
           'note':'64 unfinished,58 setup-blocked,3 train reds,10 source-read errors; original outcomes remain historical. This is not a whole-shard receipt.'}
          (out/'python4-inventory.json').write_text(json.dumps(inv,indent=2)+'\n')
          class Result(u.TimedResult):
           def __init__(self,*args,**kwargs):
            super().__init__(*args,**kwargs);self.success_ids=[];self.started_ids=[]
           def startTest(self,test):
            self.started_ids.append(test.id());super().startTest(test)
           def addSuccess(self,test):
            self.success_ids.append(test.id());super().addSuccess(test)
          modules=collections.OrderedDict()
          for t in selected:modules.setdefault(loader.owners[id(t)],[]).append(t)
          times={};began=time.monotonic()
          planned=unittest.TestSuite(u.TimedModule(tests,path,times) for path,tests in modules.items())
          result=unittest.TextTestRunner(verbosity=2,resultclass=Result).run(planned)
          after=git('status','--porcelain')
          record={'kind':'explicit-python4-case-subset','source':expected_source,'tree':git('rev-parse','HEAD^{tree}'),
           'inventory_sha256':hashlib.sha256((out/'python4-inventory.json').read_bytes()).hexdigest(),
           'planned':len(selected),'tests_run':result.testsRun,'started_ids':result.started_ids,'passed_ids':result.success_ids,
           'failures':[{'id':t.id(),'traceback':v} for t,v in result.failures],
           'errors':[{'id':t.id(),'traceback':v} for t,v in result.errors],
           'skipped':[{'id':t.id(),'reason':v} for t,v in result.skipped],
           'expected_failures':[{'id':t.id(),'traceback':v} for t,v in result.expectedFailures],
           'unexpected_successes':[t.id() for t in result.unexpectedSuccesses],
           'wall_seconds':time.monotonic()-began,'case_times':result.times,'file_times':times,
           'tree_before':before,'tree_after':after,'tree_unchanged':before==after=='',
           'was_successful':result.wasSuccessful()}
          (out/'python4-result.json').write_text(json.dumps(record,indent=2)+'\n')
          assert set(result.started_ids)==set(requested) and len(result.started_ids)==len(requested), 'selected cases did not all start once'
          assert before==after=='', 'source changed while checking'
          sys.exit(0 if result.wasSuccessful() else 1)
          PYSUBSET
      - name: Whole release check, ${{ matrix.steps }}
        if: matrix.python_shard != 'subset'
        shell: bash
        run: |
          set -euo pipefail
          shard_args=()
          if [[ -n "${{ matrix.python_shard }}" ]]; then
            shard_args=(--python-shard "${{ matrix.python_shard }}")
          fi
          /usr/bin/python3 -I tools/release_check.py --out "$RUNNER_TEMP/check" --node "$(command -v node)" --only "${{ matrix.steps }}" "${shard_args[@]}" --quarantine-at event
      - name: Write this shard's receipt
        if: always()
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHARD_NAME: ${{ matrix.name }}
          SHARD_STEPS: ${{ matrix.steps }}
          PYTHON_SHARD: ${{ matrix.python_shard }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/check"
          # The check must begin with a fresh output directory. Preserve the pre-run binding only after it ends.
          cp "$RUNNER_TEMP/dispatch-source.json" "$RUNNER_TEMP/check/dispatch-source.json"
          # The receipt a validator binds this shard to: written here, by the job that ran it, so a shard repackaged from
          # another run or attempt cannot pass as this one. The profile says what the cases ran on.
          /usr/bin/python3 -I - "$RUNNER_TEMP/check/run.json" <<'PY'
          import hashlib, json, os, platform, re, subprocess, sys
          env = os.environ
          def out(*argv):
              try:
                  return subprocess.run(argv, capture_output=True, text=True).stdout.strip()
              except OSError:
                  return None
          def digest(path):
              try:
                  return hashlib.sha256(open(path, "rb").read()).hexdigest()
              except OSError:
                  return None
          receipt = {
              "run": {"id": env.get("GITHUB_RUN_ID"), "attempt": env.get("GITHUB_RUN_ATTEMPT"), "workflow": env.get("GITHUB_WORKFLOW"),
                      "job": env.get("GITHUB_JOB"), "event": env.get("GITHUB_EVENT_NAME"), "repository": env.get("GITHUB_REPOSITORY"),
                      # The commit this workflow file was read from: the proof of whose workflow judged the run.
                      "workflow_sha": env.get("GITHUB_WORKFLOW_SHA"), "workflow_ref": env.get("GITHUB_WORKFLOW_REF")},
              "shard": {"name": env.get("SHARD_NAME"), "steps": (env.get("SHARD_STEPS") or "").split(",")},
              "python_selection": env.get("PYTHON_SHARD"),
              "subset_inventory_sha256": digest(os.path.join(os.path.dirname(sys.argv[1]), "python4-inventory.json")),
              "subset_result_sha256": digest(os.path.join(os.path.dirname(sys.argv[1]), "python4-result.json")),
              "subset_log_sha256": digest(os.path.join(os.path.dirname(sys.argv[1]), "python-units.log")),
              "base": {"ref": env.get("BASE_REF") or None, "sha": env.get("BASE_SHA") or None},
              "head": {"ref": env.get("HEAD_REF") or env.get("GITHUB_REF"), "sha": env.get("HEAD_SHA") or env.get("GITHUB_SHA")},
              # The commit the check ran, read from the checkout. On a pull request it is the merge commit: its first
              # parent is the base GitHub merged onto, which can be newer than the event's base, and its second is the
              # pull request's head; on a push it has one parent and the second reads as none.
              "merge": {"sha": out("git", "rev-parse", "HEAD"), "tree": out("git", "rev-parse", "HEAD^{tree}"),
                        "first_parent": out("git", "rev-parse", "--verify", "-q", "HEAD^1") or None,
                        "second_parent": out("git", "rev-parse", "--verify", "-q", "HEAD^2") or None},
              # The summary this receipt vouches for, so a summary swapped in beside a genuine receipt does not count.
              "summary_sha256": digest(os.path.join(os.path.dirname(sys.argv[1]), "summary.json")),
              "profile": {"runner_os": env.get("RUNNER_OS"), "runner_arch": env.get("RUNNER_ARCH"), "image_os": env.get("ImageOS"),
                          "image_version": env.get("ImageVersion"), "platform": platform.platform(), "python": sys.version.split()[0],
                          "node": out("node", "--version"), "chrome": env.get("CHROME_VERSION"), "playwright": env.get("PLAYWRIGHT_VERSION"),
                          "chrome_path": env.get("AIM_CHROME_FOR_TESTING"), "playwright_core": env.get("AIM_PLAYWRIGHT_CORE"),
                          # The settings the cases turned out to depend on: how scroll bars show, whether motion is reduced,
                          # and how loaded the machine was, which a Mac at a desk never varies.
                          "scroll_bars": out("defaults", "read", "-g", "AppleShowScrollBars") or "default",
                          "reduce_motion": out("defaults", "read", "com.apple.universalaccess", "reduceMotion") or "default",
                          "cpus": out("sysctl", "-n", "hw.ncpu"),
                          "load_after": out("sysctl", "-n", "vm.loadavg")},
          }
          # Preserve the event's base above. This is the base Git actually used to build the tested merge.
          if env.get("GITHUB_EVENT_NAME") == "pull_request" and not re.fullmatch(r"[0-9a-f]{40}", receipt["merge"]["first_parent"] or ""):
              sys.exit("the PR checkout has no Git first-parent commit id")
          receipt["base_at_run"] = ({"ref": env.get("BASE_REF"), "sha": receipt["merge"]["first_parent"]}
                                    if env.get("GITHUB_EVENT_NAME") == "pull_request" else None)
          json.dump(receipt, open(sys.argv[1], "w"), indent=1)
          PY
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore
